services:
  db:
    image: postgres:16.9
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flit
      POSTGRES_PASSWORD: flit
      POSTGRES_DB: flit
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/:/opt/keycloak/data/import
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: flit
      KC_BOOTSTRAP_ADMIN_PASSWORD: flit
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: true
